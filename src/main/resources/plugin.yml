name: BedWars1058-Ultimate
version: ${version}
main: dev.etran.ultimate.UltimatePlugin
api-version: '1.13'
description: Hypixel-style Ultimate mode for BedWars1058, fully configurable in YAML and in-game.
authors: [thelittlebotengineer]
depend: [BedWars1058]

commands:
  bwultimate:
    description: Pick an ultimate, reload the plugin or edit its configuration.
    usage: /<command> help
    aliases: [bwu, ultimates]

permissions:
  etranultimate.use:
    description: Pick an ultimate and open the menu.
    default: true
  etranultimate.use.*:
    description: Use every ultimate (only matters when selection.permission-per-ultimate is on).
    default: true
  etranultimate.reload:
    description: Reload configuration and refresh players.
    default: op
  etranultimate.config:
    description: Edit configuration (in-game editor and /bwu config).
    default: op
  etranultimate.give:
    description: Force or remove ultimates on other players.
    default: op
  etranultimate.admin:
    description: Everything above plus diagnostics.
    default: op
    children:
      etranultimate.use: true
      etranultimate.reload: true
      etranultimate.config: true
      etranultimate.give: true
